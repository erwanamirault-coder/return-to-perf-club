<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
<meta charset="UTF-8">
<title>Stats équipe — Return To Perf</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F4CA9">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { black: '#000000', white: '#FFFFFF', blue: { light: '#69A0F2', DEFAULT: '#2D7AED', dark: '#0F4CA9' } } },
        fontFamily: { heading: ['Oswald','sans-serif'], body: ['Poppins','sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  h1,h2,h3,.font-heading { font-family: 'Oswald', sans-serif; }
</style>
</head>
<body class="min-h-screen">

<div id="loading-state" class="min-h-screen flex items-center justify-center">
  <p class="text-sm text-[color:var(--fg-50)]">Chargement...</p>
</div>

<main id="content" class="max-w-4xl mx-auto px-4 sm:px-6 py-8 hidden">

  <div class="mb-8">
    <a id="back-link" href="dashboard.html" class="text-xs text-[color:var(--fg-50)] hover:text-[color:var(--fg)] transition-colors">← Retour</a>
    <h1 class="font-heading uppercase text-2xl font-bold leading-tight mt-2">Stats équipe</h1>
    <p id="sous-titre" class="text-sm text-[color:var(--fg-60)] mt-1"></p>
  </div>

  <div id="vue-admin" class="hidden rounded-2xl border border-[color:var(--border)] bg-[color:var(--card)] p-4 sm:p-5 mb-6">
    <h2 class="font-heading uppercase text-[11px] font-bold text-[color:var(--fg-50)] tracking-widest mb-3">Statut de charge — vue d'ensemble</h2>
    <div id="admin-joueurs-table" class="flex flex-col gap-2"></div>
  </div>

  <div class="rounded-2xl border border-[color:var(--border)] bg-[color:var(--card)] p-4 sm:p-5">
    <h2 class="font-heading uppercase text-[11px] font-bold text-[color:var(--fg-50)] tracking-widest mb-1">Comparatif par mouvement</h2>
    <p id="comparatif-sous-texte" class="text-xs text-[color:var(--fg-40)] mb-4"></p>
    <div id="mouvements-list" class="flex flex-col gap-6"></div>
    <p id="mouvements-empty" class="hidden text-sm text-[color:var(--fg-40)] text-center py-10">Aucun test enregistré pour l'équipe pour l'instant.</p>
  </div>

</main>

<script src="supabase-config.js"></script>
<script src="theme.js"></script>
<script>
  const ADMIN_EMAIL = 'erwan20b@gmail.com';

  function escapeHtml(s) {
    return (s || '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function acwrZone(val) {
    if (val === null) return ['text-[color:var(--fg-40)]', 'bg-[color:var(--card)]', '—'];
    if (val < 0.8) return ['text-blue-500', 'bg-blue-50', 'Charge basse'];
    if (val <= 1.3) return ['text-green-600', 'bg-green-50', 'Zone optimale'];
    if (val <= 1.5) return ['text-amber-500', 'bg-amber-50', 'À surveiller'];
    return ['text-red-500', 'bg-red-50', 'Risque élevé'];
  }

  async function calculerAcwr(joueurId) {
    const since42 = new Date(Date.now() - 42 * 86400000).toISOString();
    const { data: rows } = await supabaseClient.from('seances_rpe').select('charge_calculee, created_at').eq('joueur_id', joueurId).gte('created_at', since42);
    const semaines = [];
    for (let i = 5; i >= 0; i--) {
      const debut = new Date(Date.now() - (i+1) * 7 * 86400000);
      const fin = new Date(Date.now() - i * 7 * 86400000);
      const total = (rows || []).filter(r => { const d = new Date(r.created_at); return d >= debut && d < fin; }).reduce((s,r) => s + (r.charge_calculee||0), 0);
      semaines.push(total);
    }
    const charge7j = semaines[5];
    const chronique = (semaines[0]+semaines[1]+semaines[2]+semaines[3]) / 4;
    return chronique > 0 ? +(charge7j / chronique).toFixed(2) : null;
  }

  (async function load() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const isAdmin = user.email === ADMIN_EMAIL;
    document.getElementById('back-link').href = isAdmin ? 'admin-equipe.html' : 'dashboard.html';

    let equipeId, joueurActuelId = null;

    if (isAdmin) {
      const { data: equipes } = await supabaseClient.from('equipes').select('*').order('created_at', { ascending: false }).limit(1);
      if (!equipes || !equipes.length) {
        document.getElementById('sous-titre').textContent = 'Aucun groupe créé pour l\'instant.';
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        return;
      }
      equipeId = equipes[0].id;
      document.getElementById('sous-titre').textContent = `${equipes[0].nom} — ${equipes[0].saison}`;
      document.getElementById('vue-admin').classList.remove('hidden');
      document.getElementById('comparatif-sous-texte').textContent = 'Position de chaque joueur par rapport à la moyenne de l\'équipe.';
      await renderVueAdmin(equipeId);
    } else {
      const { data: joueur } = await supabaseClient.from('joueurs').select('*').eq('user_id', user.id).maybeSingle();
      if (!joueur) { window.location.href = 'dashboard.html'; return; }
      equipeId = joueur.equipe_id;
      joueurActuelId = joueur.id;
      document.getElementById('sous-titre').textContent = 'Ta position par rapport à la moyenne de l\'équipe.';
      document.getElementById('comparatif-sous-texte').textContent = 'Ta valeur (en bleu) comparée à la moyenne de l\'équipe (en gris), par mouvement.';
    }

    await renderComparatifMouvements(equipeId, joueurActuelId, isAdmin);

    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  })();

  async function renderVueAdmin(equipeId) {
    const { data: joueurs } = await supabaseClient.from('joueurs').select('*').eq('equipe_id', equipeId).order('nom');
    const rows = joueurs || [];
    const table = document.getElementById('admin-joueurs-table');
    table.innerHTML = rows.map(j => `<div class="flex items-center justify-between gap-3 py-2 border-b border-[color:var(--border)] last:border-0" data-row="${j.id}">
      <div class="flex items-center gap-3 min-w-0">
        <span class="w-8 h-8 rounded-full bg-brand-blue/10 text-[color:var(--accent)] flex items-center justify-center text-xs font-bold shrink-0">${(j.prenom||'?').charAt(0)}${(j.nom||'').charAt(0)}</span>
        <p class="text-sm font-semibold truncate">${escapeHtml(j.prenom)} ${escapeHtml(j.nom)}</p>
      </div>
      <span class="acwr-badge text-xs font-semibold px-2.5 py-1 rounded-full shrink-0">...</span>
    </div>`).join('');

    for (const j of rows) {
      const acwr = await calculerAcwr(j.id);
      const [textClass, bgClass, label] = acwrZone(acwr);
      const badge = table.querySelector(`[data-row="${j.id}"] .acwr-badge`);
      badge.className = `acwr-badge text-xs font-semibold px-2.5 py-1 rounded-full shrink-0 ${textClass} ${bgClass}`;
      badge.textContent = acwr !== null ? `${acwr} · ${label}` : '—';
    }
  }

  async function renderComparatifMouvements(equipeId, joueurActuelId, isAdmin) {
    const { data: joueursEquipe } = await supabaseClient.from('joueurs').select('id').eq('equipe_id', equipeId);
    const ids = (joueursEquipe || []).map(j => j.id);
    if (!ids.length) { document.getElementById('mouvements-empty').classList.remove('hidden'); return; }

    const { data: tests } = await supabaseClient.from('tests_physiques').select('*').in('joueur_id', ids).order('date_test', { ascending: false });
    const rows = tests || [];
    if (!rows.length) { document.getElementById('mouvements-empty').classList.remove('hidden'); return; }

    const dernieres = {};
    rows.forEach(t => {
      const key = t.type_test + '|' + t.joueur_id;
      if (!dernieres[key]) dernieres[key] = t;
    });

    const parType = {};
    Object.values(dernieres).forEach(t => {
      if (!parType[t.type_test]) parType[t.type_test] = [];
      parType[t.type_test].push(t);
    });

    const container = document.getElementById('mouvements-list');
    container.innerHTML = '';

    Object.entries(parType).forEach(([type, valeurs]) => {
      const moyenne = +(valeurs.reduce((s,v) => s + parseFloat(v.valeur), 0) / valeurs.length).toFixed(2);
      const unite = valeurs[0].unite;
      const card = document.createElement('div');

      if (isAdmin) {
        const sorted = [...valeurs].sort((a,b) => b.valeur - a.valeur);
        card.innerHTML = `
          <h3 class="font-heading text-sm font-bold uppercase tracking-wide mb-2">${escapeHtml(type)} <span class="text-[color:var(--fg-40)] font-normal normal-case">— moyenne ${moyenne} ${escapeHtml(unite)}</span></h3>
          <canvas height="90"></canvas>
        `;
        container.appendChild(card);
        new Chart(card.querySelector('canvas'), {
          type: 'bar',
          data: { labels: sorted.map(v => v.joueur_id.slice(0,4)), datasets: [{ data: sorted.map(v => v.valeur), backgroundColor: '#2D7AED', borderRadius: 4 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#F1F5F9' } }, x: { grid: { display: false } } } }
        });
      } else {
        const saValeur = valeurs.find(v => v.joueur_id === joueurActuelId);
        card.innerHTML = `
          <h3 class="font-heading text-sm font-bold uppercase tracking-wide mb-2">${escapeHtml(type)}</h3>
          <canvas height="70"></canvas>
        `;
        container.appendChild(card);
        new Chart(card.querySelector('canvas'), {
          type: 'bar',
          data: { labels: ['Toi', 'Moyenne équipe'], datasets: [{ data: [saValeur ? saValeur.valeur : 0, moyenne], backgroundColor: ['#2D7AED', '#CBD5E1'], borderRadius: 4 }] },
          options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#F1F5F9' } }, y: { grid: { display: false } } } }
        });
      }
    });
  }
</script>

</body>
</html>
