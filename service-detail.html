<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { blue: { light: '#69A0F2', DEFAULT: '#2D7AED', dark: '#0F4CA9' } }
        },

<style>
  body { font-family: 'Poppins', sans-serif; }
  h1, h2, .font-heading { font-family: 'Oswald', sans-serif; }

  #content h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 1.4rem; margin-top: 5.5rem; margin-bottom: 1.5rem; }
  #content > h2:first-child { margin-top: 0; }
  #content strong { font-weight: 600; color: var(--fg); }
  #content ul { list-style: none; padding-left: 0; margin: 0.75rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
  #content ol { list-style: none; padding-left: 0; margin: 1.25rem 0; display: flex; flex-direction: column; gap: 0.85rem; counter-reset: step; }
  #content ol li { counter-increment: step; position: relative; padding: 1.15rem 1.15rem 1.15rem 3.5rem; border-radius: 0.75rem; background: var(--card); border: 1px solid var(--border); }
  #content ol li::before { content: counter(step); position: absolute; left: 1.15rem; top: 1.15rem; width: 1.5rem; height: 1.5rem; border-radius: 999px; background: #2D7AED; color: white; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
  #content p { margin-bottom: 1.1rem; line-height: 1.75; color: var(--fg-70); max-width: 60rem; font-size: 1.02rem; }

  .profile-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin: 2rem 0; }
  @media (min-width: 640px) { .profile-grid { grid-template-columns: repeat(3, 1fr); } }
  .profile-card { position: relative; border-radius: 1.25rem; overflow: hidden; aspect-ratio: 3/4; }
  @media (min-width: 1024px) { .profile-card { aspect-ratio: 3/5; } }
  .profile-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
  .profile-card:hover img { transform: scale(1.08); }
  .profile-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.05) 100%); }
  .profile-card-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4rem; }
  #content .profile-card-body h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 1.15rem; margin-bottom: 0; color: #ffffff !important; max-width: none; }
  .profile-card-detail { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .3s ease, margin-top .35s ease; }
  .profile-card:hover .profile-card-detail { max-height: 8rem; opacity: 1; margin-top: 0.6rem; }
  #content .profile-card-detail p,
  #content .profile-card-detail p * { color: #ffffff !important; font-size: 0.85rem; margin-bottom: 0; line-height: 1.55; max-width: none; }

  .cta-inline { border-top: 1px solid var(--border); padding-top: 2rem; margin-top: 2rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
  .cta-inline-tagline { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 1.2rem; color: var(--fg); margin: 0; line-height: 1.3; max-width: 28rem; }
  .cta-inline-btn { display: inline-block; padding: 0.9rem 1.85rem; border-radius: 999px; background: #2D7AED; color: white; font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 600; font-size: 0.8rem; white-space: nowrap; transition: background .15s ease; }
  .cta-inline-btn:hover { background: #0F4CA9; }

  .faq-list { display: flex; flex-direction: column; gap: 0.6rem; margin: 1.25rem 0; }
  .faq-item { border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem 1.25rem; background: var(--card); }
  .faq-item summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; color: var(--fg); list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after { content: '+'; font-size: 1.2rem; color: #2D7AED; margin-left: 1rem; transition: transform .2s ease; }
  .faq-item[open] summary::after { transform: rotate(45deg); }
  .faq-item p { margin-top: 0.75rem; margin-bottom: 0; font-size: 0.85rem; max-width: none; }
</style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 bg-[color:var(--bg)] flex items-center justify-between px-6 sm:px-10 py-5 border-b border-[color:var(--border)]">
    <a href="index.html" class="flex items-center gap-2">

    </a>
    <div class="flex items-center gap-4 text-sm">

  <main class="px-6 sm:px-10 py-14 max-w-2xl lg:max-w-5xl xl:max-w-6xl mx-auto">

    <div id="offer-content" class="hidden">

        <svg id="hero-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2D7AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-4 mx-auto">
          <circle cx="6" cy="6" r="2.2"/>
          <circle cx="18" cy="6" r="2.2"/>
          <circle cx="12" cy="12" r="2.2"/>
          <circle cx="6" cy="18" r="2.2"/>
          <circle cx="18" cy="18" r="2.2"/>
          <path d="M7.7 7.5 10.3 10.5M16.3 7.5 13.7 10.5M7.7 16.5 10.3 13.5M16.3 16.5 13.7 13.5"/>
        </svg>
        <span id="offer-badge" class="hidden inline-block mb-4 px-3 py-1 rounded-full bg-brand-blue/10 text-brand-blue text-[11px] uppercase tracking-widest font-semibold"></span>
        <h1 id="offer-titre" class="font-heading uppercase text-3xl sm:text-4xl md:text-5xl font-bold leading-tight text-[color:var(--fg)] max-w-3xl mx-auto"></h1>
      </div>

      <img id="hero-photo" class="hidden w-full rounded-2xl object-cover mb-14" style="max-height:460px;" alt="">

      <div id="content"></div>

      <div id="cta-zone" class="mt-10 pt-8 border-t border-[color:var(--border)] text-center"></div>
    </div>

    <div id="not-found" class="hidden text-center py-16">
      <p class="text-sm text-[color:var(--fg-60)] mb-6">Cette offre n'existe pas ou n'est plus disponible.</p>
      <a href="mes-services.html" class="inline-block px-6 py-3 rounded-lg bg-brand-blue hover:bg-brand-blue-dark transition-colors text-white font-heading uppercase text-sm font-semibold">
        Voir mes services
      </a>
    </div>

  <footer class="text-center px-6 pb-10">
    <div class="mt-4 pt-8 border-t border-[color:var(--border)] flex flex-col items-center gap-4">
      <a href="https://www.instagram.com/erwanamirault?igsh=ZWZjMXUwc3liamlp" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="text-[color:var(--fg-50)] hover:text-brand-blue transition-colors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="mailto:erwan.amirault@gmail.com" class="text-sm text-[color:var(--fg-60)] hover:text-[color:var(--fg)] transition-colors">
        erwan.amirault@gmail.com
      </a>
      <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs text-[color:var(--fg-40)]">

        <a href="mentions-legales.html" class="hover:text-[color:var(--fg)] transition-colors">Mentions légales</a>
        <a href="cgv.html" class="hover:text-[color:var(--fg)] transition-colors">CGV</a>
        <a href="politique-confidentialite.html" class="hover:text-[color:var(--fg)] transition-colors">Politique de confidentialité</a>
      </div>
      <p class="text-[10px] text-[color:var(--fg-30)]">© 2026 Return To Perf — Erwan Amirault. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="supabase-config.js"></script>
  <script src="theme.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderInline(str) {
      return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function renderPlainBlock(text) {
      const lines = text.split('\n');
      let html = '';
      let inList = false;
      let listType = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith(':::')) {
          if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = null; }
          const parts = trimmed.slice(3).split('|').map(s => s.trim());
          const [tagline, btnText, btnLink] = parts;
          html += `<div class="cta-inline">
            <p class="cta-inline-tagline">${renderInline(tagline || '')}</p>
            ${btnText && btnLink ? `<a href="${btnLink}" target="_blank" rel="noopener noreferrer" class="cta-inline-btn">${escapeHtml(btnText)}</a>` : ''}
          </div>`;
        } else if (trimmed.startsWith('- ')) {
          if (!inList || listType !== 'ul') { if (inList) html += listType === 'ul' ? '</ul>' : '</ol>'; html += '<ul>'; inList = true; listType = 'ul'; }
          html += `<li class="flex gap-2"><span class="text-brand-blue shrink-0">•</span><span>${renderInline(trimmed.slice(2))}</span></li>`;
        } else if (/^\d+\.\s/.test(trimmed)) {
          if (!inList || listType !== 'ol') { if (inList) html += listType === 'ul' ? '</ul>' : '</ol>'; html += '<ol>'; inList = true; listType = 'ol'; }
          html += `<li>${renderInline(trimmed.replace(/^\d+\.\s*/, ''))}</li>`;
        } else if (trimmed === '') {
          if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = null; }
        } else {
          if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = null; }
          html += `<p>${renderInline(trimmed)}</p>`;
        }
      });
      if (inList) html += listType === 'ul' ? '</ul>' : '</ol>';
      return html;
    }

    function renderMarkdownLite(text) {
      const sectionBlocks = text.split(/\n(?=## )/);
      let html = '';

      sectionBlocks.forEach(block => {
        const lines = block.split('\n');
        let sectionTitle = '';
        let body = block;

        if (lines[0].startsWith('## ')) {
          sectionTitle = lines[0].slice(3).trim();
          body = lines.slice(1).join('\n');
          html += `<h2>${escapeHtml(sectionTitle)}</h2>`;
        }

        const subBlocks = body.split(/\n(?=### )/).filter(b => b.trim() !== '');
        const hasSubHeadings = subBlocks.some(b => b.trim().startsWith('### '));

        if (!hasSubHeadings) {
          html += renderPlainBlock(body);
          return;
        }

        const isFaq = /question/i.test(sectionTitle);
        const isProfiles = /toi|profil|âge|age/i.test(sectionTitle);

        if (isFaq) {
          html += '<div class="faq-list">';
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              const q = escapeHtml(subLines[0].trim().slice(4).trim());
              const a = renderInline(subLines.slice(1).join(' ').trim());
              html += `<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`;
            } else {
              html += renderPlainBlock(sub);
            }
          });
          html += '</div>';
        } else if (isProfiles) {
          html += '<div class="profile-grid">';
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              const t = escapeHtml(subLines[0].trim().slice(4).trim());
              let rest = subLines.slice(1).join('\n').trim();
              let imgTag = '';
              const imgMatch = rest.match(/^!\[(.*?)\]\((.*?)\)/);
              if (imgMatch) {
                imgTag = `<img src="${imgMatch[2]}" alt="${escapeHtml(imgMatch[1])}">`;
                rest = rest.slice(imgMatch[0].length).trim();
              }
              const p = renderInline(rest);
              html += `<div class="profile-card">${imgTag}<div class="profile-card-overlay"></div><div class="profile-card-body"><h3>${t}</h3><div class="profile-card-detail"><p>${p}</p></div></div></div>`;
            } else {
              html += renderPlainBlock(sub);
            }
          });
          html += '</div>';
        } else {
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              html += `<h3 class="font-heading uppercase text-base font-bold mt-4 mb-1.5">${escapeHtml(subLines[0].trim().slice(4).trim())}</h3>`;
              html += renderPlainBlock(subLines.slice(1).join('\n'));
            } else {
              html += renderPlainBlock(sub);
            }
          });
        }
      });

      return html;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const { data, error } = await supabaseClient.from('offres_services').select('*').eq('id', id).maybeSingle();

      document.getElementById('loading').classList.add('hidden');

      if (error || !data) {
        document.getElementById('not-found').classList.remove('hidden');
        return;
      }

      document.title = data.titre + ' | Erwan Amirault';

      if (data.image_url) {
        document.getElementById('hero-photo').src = data.image_url;
        document.getElementById('hero-photo').classList.remove('hidden');
        document.getElementById('hero-icon').classList.add('hidden');
      }

      if (data.badge) {
        document.getElementById('offer-badge').textContent = data.badge;
        document.getElementById('offer-badge').classList.remove('hidden');
      }

      // Titre : accroche bicolore ({{mot}} = en bleu) si définie, sinon titre brut
      if (data.accroche) {
        const withColor = escapeHtml(data.accroche)
          .replace(/\n/g, '<br>')
          .replace(/\{\{(.+?)\}\}/g, '<span class="text-brand-blue" style="color:#2D7AED">$1</span>');
        document.getElementById('offer-titre').innerHTML = withColor;
      } else {
        document.getElementById('offer-titre').textContent = data.titre;
      }

      if (!data.description_longue) {
        document.getElementById('content').innerHTML = `<p class="text-[color:var(--fg-50)] italic">Le contenu détaillé de cette offre arrive bientôt.</p>`;
        document.getElementById('offer-content').classList.remove('hidden');
        return;
      }

      document.getElementById('content').innerHTML = renderMarkdownLite(data.description_longue);

      if (data.bouton_texte && data.bouton_lien) {
        const cta = document.getElementById('cta-zone');
        cta.innerHTML = `<a href="${data.bouton_lien}" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center px-6 py-4 rounded-xl bg-brand-blue hover:bg-brand-blue-dark transition-colors text-white font-heading uppercase tracking-wide font-semibold shadow-lg shadow-brand-blue/20">${escapeHtml(data.bouton_texte)}</a>`;
      }

      document.getElementById('offer-content').classList.remove('hidden');
    }

    load();
  </script>

</body>
</html>
