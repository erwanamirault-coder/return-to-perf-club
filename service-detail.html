<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return To Perf</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { blue: { light: '#69A0F2', DEFAULT: '#2D7AED', dark: '#0F4CA9' } }
        },
        fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  h1, h2, .font-heading { font-family: 'Oswald', sans-serif; }

  #content h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 1.25rem; margin-top: 2.5rem; margin-bottom: 1rem; }
  #content strong { font-weight: 600; color: var(--fg); }
  #content ul { list-style: none; padding-left: 0; margin: 0.75rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
  #content ol { list-style: none; padding-left: 0; margin: 1rem 0; display: flex; flex-direction: column; gap: 0.75rem; counter-reset: step; }
  #content ol li { counter-increment: step; position: relative; padding: 1rem 1rem 1rem 3.25rem; border-radius: 0.75rem; background: var(--card); border: 1px solid var(--border); }
  #content ol li::before { content: counter(step); position: absolute; left: 1rem; top: 1rem; width: 1.5rem; height: 1.5rem; border-radius: 999px; background: #2D7AED; color: white; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
  #content p { margin-bottom: 1rem; line-height: 1.7; color: var(--fg-70); }
  .hero-band { background: radial-gradient(circle at 20% 0%, #3D8BFF 0%, #08316E 100%); background-size: cover; background-position: center; }

  .profile-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin: 1.5rem 0; }
  @media (min-width: 640px) { .profile-grid { grid-template-columns: repeat(3, 1fr); } }
  .profile-card { border-radius: 1rem; border: 1px solid var(--border); background: var(--card); padding: 1.25rem; }
  .profile-card h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--fg); }
  .profile-card p { font-size: 0.85rem; color: var(--fg-60); margin-bottom: 0; line-height: 1.6; }

  .faq-list { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0; }
  .faq-item { border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.9rem 1.1rem; background: var(--card); }
  .faq-item summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--fg); list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after { content: '+'; font-size: 1.2rem; color: #2D7AED; margin-left: 1rem; transition: transform .2s ease; }
  .faq-item[open] summary::after { transform: rotate(45deg); }
  .faq-item p { margin-top: 0.75rem; margin-bottom: 0; font-size: 0.85rem; }
</style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 bg-[color:var(--bg)] flex items-center justify-between px-6 sm:px-10 py-5 border-b border-[color:var(--border)]">
    <a href="index.html" class="flex items-center gap-2">
      <span class="font-heading uppercase font-bold text-sm tracking-wide">Erwan Amirault</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="mes-services.html" class="text-[color:var(--fg-60)] hover:text-[color:var(--fg)] transition-colors">← Mes services</a>
      <button id="theme-toggle" class="w-9 h-9 rounded-full border border-[color:var(--border-strong)] flex items-center justify-center hover:border-brand-blue transition-colors shrink-0"></button>
    </div>
  </header>

  <main class="px-6 py-14 max-w-2xl mx-auto">
    <div id="loading" class="text-center text-sm text-[color:var(--fg-50)]">Chargement...</div>

    <div id="offer-content" class="hidden">
      <div id="hero-band" class="hero-band rounded-3xl px-7 py-12 sm:py-16 text-white shadow-xl mb-8 relative overflow-hidden">
        <div id="hero-overlay" class="absolute inset-0"></div>
        <div class="relative">
          <svg id="hero-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-90">
            <circle cx="6" cy="6" r="2.2"/>
            <circle cx="18" cy="6" r="2.2"/>
            <circle cx="12" cy="12" r="2.2"/>
            <circle cx="6" cy="18" r="2.2"/>
            <circle cx="18" cy="18" r="2.2"/>
            <path d="M7.7 7.5 10.3 10.5M16.3 7.5 13.7 10.5M7.7 16.5 10.3 13.5M16.3 16.5 13.7 13.5"/>
          </svg>
          <span id="offer-badge" class="hidden inline-block mb-4 px-3 py-1 rounded-full bg-white/15 backdrop-blur text-[11px] uppercase tracking-widest font-semibold"></span>
          <h1 id="offer-titre" class="font-heading uppercase text-3xl sm:text-4xl md:text-5xl font-extrabold leading-[1.05]"></h1>
        </div>
      </div>

      <div id="content"></div>

      <div id="cta-zone" class="mt-10 pt-8 border-t border-[color:var(--border)] text-center"></div>
    </div>

    <div id="not-found" class="hidden text-center py-16">
      <p class="text-sm text-[color:var(--fg-60)] mb-6">Cette offre n'existe pas ou n'est plus disponible.</p>
      <a href="mes-services.html" class="inline-block px-6 py-3 rounded-lg bg-brand-blue hover:bg-brand-blue-dark transition-colors text-white font-heading uppercase text-sm font-semibold">
        Voir mes services
      </a>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="theme.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderInline(str) {
      return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function renderPlainBlock(text) {
      const lines = text.split('\n');
      let html = '';
      let inList = false;
      let listType = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('- ')) {
          if (!inList || listType !== 'ul') { if (inList) html += listType === 'ul' ? '</ul>' : '</ol>'; html += '<ul>'; inList = true; listType = 'ul'; }
          html += `<li class="flex gap-2"><span class="text-brand-blue shrink-0">•</span><span>${renderInline(trimmed.slice(2))}</span></li>`;
        } else if (/^\d+\.\s/.test(trimmed)) {
          if (!inList || listType !== 'ol') { if (inList) html += listType === 'ul' ? '</ul>' : '</ol>'; html += '<ol>'; inList = true; listType = 'ol'; }
          html += `<li>${renderInline(trimmed.replace(/^\d+\.\s*/, ''))}</li>`;
        } else if (trimmed === '') {
          if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = null; }
        } else {
          if (inList) { html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = null; }
          html += `<p>${renderInline(trimmed)}</p>`;
        }
      });
      if (inList) html += listType === 'ul' ? '</ul>' : '</ol>';
      return html;
    }

    function renderMarkdownLite(text) {
      const sectionBlocks = text.split(/\n(?=## )/);
      let html = '';

      sectionBlocks.forEach(block => {
        const lines = block.split('\n');
        let sectionTitle = '';
        let body = block;

        if (lines[0].startsWith('## ')) {
          sectionTitle = lines[0].slice(3).trim();
          body = lines.slice(1).join('\n');
          html += `<h2>${escapeHtml(sectionTitle)}</h2>`;
        }

        const subBlocks = body.split(/\n(?=### )/).filter(b => b.trim() !== '');
        const hasSubHeadings = subBlocks.some(b => b.trim().startsWith('### '));

        if (!hasSubHeadings) {
          html += renderPlainBlock(body);
          return;
        }

        const isFaq = /question/i.test(sectionTitle);
        const isProfiles = /toi|profil|âge|age/i.test(sectionTitle);

        if (isFaq) {
          html += '<div class="faq-list">';
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              const q = escapeHtml(subLines[0].trim().slice(4).trim());
              const a = renderInline(subLines.slice(1).join(' ').trim());
              html += `<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`;
            } else {
              html += renderPlainBlock(sub);
            }
          });
          html += '</div>';
        } else if (isProfiles) {
          html += '<div class="profile-grid">';
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              const t = escapeHtml(subLines[0].trim().slice(4).trim());
              const p = renderInline(subLines.slice(1).join(' ').trim());
              html += `<div class="profile-card"><h3>${t}</h3><p>${p}</p></div>`;
            } else {
              html += renderPlainBlock(sub);
            }
          });
          html += '</div>';
        } else {
          subBlocks.forEach(sub => {
            const subLines = sub.split('\n');
            if (subLines[0].trim().startsWith('### ')) {
              html += `<h3 class="font-heading uppercase text-base font-bold mt-4 mb-1.5">${escapeHtml(subLines[0].trim().slice(4).trim())}</h3>`;
              html += renderPlainBlock(subLines.slice(1).join('\n'));
            } else {
              html += renderPlainBlock(sub);
            }
          });
        }
      });

      return html;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const { data, error } = await supabaseClient.from('offres_services').select('*').eq('id', id).maybeSingle();

      document.getElementById('loading').classList.add('hidden');

      if (error || !data) {
        document.getElementById('not-found').classList.remove('hidden');
        return;
      }

      document.title = data.titre + ' | Erwan Amirault';

      if (data.image_url) {
        document.getElementById('hero-band').style.backgroundImage = `linear-gradient(rgba(8,49,110,.45), rgba(8,49,110,.75)), url('${data.image_url}')`;
        document.getElementById('hero-band').style.backgroundSize = 'cover';
        document.getElementById('hero-band').style.backgroundPosition = 'center';
        document.getElementById('hero-icon').classList.add('hidden');
      }

      if (data.badge) {
        document.getElementById('offer-badge').textContent = data.badge;
        document.getElementById('offer-badge').classList.remove('hidden');
      }

      // Titre : accroche bicolore ({{mot}} = en bleu clair) si définie, sinon titre brut
      if (data.accroche) {
        const withColor = escapeHtml(data.accroche).replace(/\{\{(.+?)\}\}/g, '<span class="text-brand-blue-light" style="color:#69A0F2">$1</span>');
        document.getElementById('offer-titre').innerHTML = withColor;
      } else {
        document.getElementById('offer-titre').textContent = data.titre;
      }

      if (!data.description_longue) {
        document.getElementById('content').innerHTML = `<p class="text-[color:var(--fg-50)] italic">Le contenu détaillé de cette offre arrive bientôt.</p>`;
        document.getElementById('offer-content').classList.remove('hidden');
        return;
      }

      document.getElementById('content').innerHTML = renderMarkdownLite(data.description_longue);

      if (data.bouton_texte && data.bouton_lien) {
        const cta = document.getElementById('cta-zone');
        cta.innerHTML = `<a href="${data.bouton_lien}" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center px-6 py-4 rounded-xl bg-brand-blue hover:bg-brand-blue-dark transition-colors text-white font-heading uppercase tracking-wide font-semibold shadow-lg shadow-brand-blue/20">${escapeHtml(data.bouton_texte)}</a>`;
      }

      document.getElementById('offer-content').classList.remove('hidden');
    }

    load();
  </script>

</body>
</html>
