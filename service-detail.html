<!DOCTYPE html>
<html lang="fr">
<head>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail de l'offre — Erwan Amirault</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            black: '#000000', white: '#FFFFFF',
            blue: { light: '#69A0F2', DEFAULT: '#2D7AED', dark: '#0F4CA9' }
          }
        },
        fontFamily: { heading: ['Oswald', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  h1, h2, .font-heading { font-family: 'Oswald', sans-serif; }
  #content h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-weight: 700; font-size: 1.15rem; margin-top: 2rem; margin-bottom: 0.75rem; }
  #content strong { font-weight: 600; color: var(--fg); }
  #content ul { list-style: disc; padding-left: 1.25rem; margin: 0.75rem 0; display: flex; flex-direction: column; gap: 0.4rem; }
  #content p { margin-bottom: 1rem; line-height: 1.7; color: var(--fg-70); }
</style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 bg-[color:var(--bg)] flex items-center justify-between px-6 sm:px-10 py-5 border-b border-[color:var(--border)]">
    <a href="index.html" class="flex items-center gap-2">
      <span class="font-heading uppercase font-bold text-sm tracking-wide">Erwan Amirault</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="mes-services.html" class="text-[color:var(--fg-60)] hover:text-[color:var(--fg)] transition-colors">← Mes services</a>
      <button id="theme-toggle" class="w-9 h-9 rounded-full border border-[color:var(--border-strong)] flex items-center justify-center hover:border-brand-blue transition-colors shrink-0"></button>
    </div>
  </header>

  <main class="px-6 py-14 max-w-2xl mx-auto">
    <div id="loading" class="text-center text-sm text-[color:var(--fg-50)]">Chargement...</div>

    <div id="offer-content" class="hidden">
      <span id="offer-badge" class="hidden inline-block mb-4 px-3 py-1 rounded-full text-[11px] uppercase tracking-widest font-semibold bg-brand-blue-dark text-white"></span>
      <h1 id="offer-titre" class="font-heading uppercase text-2xl sm:text-3xl font-bold mb-8"></h1>

      <div id="content"></div>

      <div id="cta-zone" class="mt-10 pt-8 border-t border-[color:var(--border)] text-center"></div>
    </div>

    <div id="not-found" class="hidden text-center py-16">
      <p class="text-sm text-[color:var(--fg-60)] mb-6">Cette offre n'existe pas ou n'est plus disponible.</p>
      <a href="mes-services.html" class="inline-block px-6 py-3 rounded-lg bg-brand-blue hover:bg-brand-blue-dark transition-colors text-white font-heading uppercase text-sm font-semibold">
        Voir mes services
      </a>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script src="theme.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Convertisseur minimal : ## titres, **gras**, listes à tirets, paragraphes
    function renderMarkdownLite(text) {
      const lines = text.split('\n');
      let html = '';
      let inList = false;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('## ')) {
          if (inList) { html += '</ul>'; inList = false; }
          html += `<h2>${escapeHtml(trimmed.slice(3))}</h2>`;
        } else if (trimmed.startsWith('- ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${escapeHtml(trimmed.slice(2))}</li>`;
        } else if (trimmed === '') {
          if (inList) { html += '</ul>'; inList = false; }
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          const withBold = escapeHtml(trimmed).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
          html += `<p>${withBold}</p>`;
        }
      });
      if (inList) html += '</ul>';
      return html;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const { data, error } = await supabaseClient
        .from('offres_services')
        .select('*')
        .eq('id', id)
        .eq('actif', true)
        .maybeSingle();

      document.getElementById('loading').classList.add('hidden');

      if (error || !data) {
        document.getElementById('not-found').classList.remove('hidden');
        return;
      }

      document.title = data.titre + ' | Erwan Amirault';

      if (data.badge) {
        document.getElementById('offer-badge').textContent = data.badge;
        document.getElementById('offer-badge').classList.remove('hidden');
      }
      document.getElementById('offer-titre').textContent = data.titre;

      if (!data.description_longue) {
        document.getElementById('content').innerHTML = `<p class="text-[color:var(--fg-50)] italic">Le contenu détaillé de cette offre arrive bientôt.</p>`;
        document.getElementById('offer-content').classList.remove('hidden');
        return;
      }

      document.getElementById('content').innerHTML = renderMarkdownLite(data.description_longue);

      if (data.bouton_texte && data.bouton_lien) {
        document.getElementById('cta-zone').innerHTML = `
          <a href="${data.bouton_lien}" target="_blank" rel="noopener noreferrer" class="inline-block px-10 py-4 rounded-lg bg-brand-blue hover:bg-brand-blue-dark transition-colors font-heading uppercase tracking-wide font-semibold text-sm text-white">
            ${escapeHtml(data.bouton_texte)}
          </a>
        `;
      }

      document.getElementById('offer-content').classList.remove('hidden');
    }

    load();
  </script>

</body>
</html>
