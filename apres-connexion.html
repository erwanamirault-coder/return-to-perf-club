<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F4CA9">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
  p { color: #6B7280; font-size: 14px; }
</style>
</head>
<body>
  <p>Connexion en cours...</p>

  <script src="supabase-config.js"></script>
  <script>
    const ADMIN_EMAIL = 'erwan20b@gmail.com';

    (async function () {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      try { await supabaseClient.rpc('link_joueur_account'); } catch (e) { /* pas grave si aucune fiche ne correspond */ }

      const userEmail = (user.email || '').toLowerCase().trim();
      window.location.href = userEmail === ADMIN_EMAIL ? 'admin.html' : 'dashboard.html';
    })();
  </script>
</body>
</html>
